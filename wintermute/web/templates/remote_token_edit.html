{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Edit Remote Token</h3>
      <p class="muted">Provider: {{ token.provider }} | User: {{ token.user_login or 'unknown' }}{% if token.user_id %} ({{ token.user_id }}){% endif %}</p>
      <form method="post" action="/remote-tokens/{{ token.id }}/edit">
        <div class="field-group">
          <label>Provider</label>
          <select name="provider" required>
            <option value="github" {% if token.provider == 'github' %}selected{% endif %}>GitHub</option>
            <option value="gitlab" {% if token.provider == 'gitlab' %}selected{% endif %}>GitLab</option>
          </select>
        </div>
        <div class="field-group">
          <label>Note</label>
          <input type="text" name="note" value="{{ token.note or '' }}" />
        </div>
        <div class="field-group">
          <label>Base URL (for self-hosted instances)</label>
          <input type="text" name="base_url" value="{{ token.base_url or '' }}" placeholder="e.g. https://gitlab.example.com" />
        </div>
        <div class="field-group">
          <label>Personal Access Token</label>
          <div style="position: relative; width: 100%;">
            <input type="password" name="token" id="token-input" value="{{ token.token }}" style="padding-right: 40px;" />
            <button type="button" id="toggle-token-btn" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: auto; background: transparent; border: none; padding: 8px; cursor: pointer; color: var(--text);" title="Show token for 10 seconds">
              <i class="fa-solid fa-eye" id="toggle-token-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit">Save Token</button>
      </form>
      <form method="post" action="/remote-tokens/{{ token.id }}/delete">
        <button type="button" class="danger" data-confirm data-confirm-message="Delete this token? This cannot be undone.">Delete Token</button>
      </form>
    </div>
  </div>
</div>

<script>
(function() {
  const tokenInput = document.getElementById('token-input');
  const toggleBtn = document.getElementById('toggle-token-btn');
  const toggleIcon = document.getElementById('toggle-token-icon');
  let hideTimeout = null;

  function hideToken() {
    tokenInput.type = 'password';
    toggleIcon.classList.remove('fa-eye-slash');
    toggleIcon.classList.add('fa-eye');
    toggleBtn.title = 'Show token for 10 seconds';
  }

  function showToken() {
    tokenInput.type = 'text';
    toggleIcon.classList.remove('fa-eye');
    toggleIcon.classList.add('fa-eye-slash');
    toggleBtn.title = 'Token will hide in 10 seconds';

    // Clear any existing timeout
    if (hideTimeout) {
      clearTimeout(hideTimeout);
    }

    // Auto-hide after 10 seconds
    hideTimeout = setTimeout(hideToken, 10000);
  }

  toggleBtn.addEventListener('click', function(e) {
    e.preventDefault();
    if (tokenInput.type === 'password') {
      showToken();
    } else {
      hideToken();
      if (hideTimeout) {
        clearTimeout(hideTimeout);
        hideTimeout = null;
      }
    }
  });
})();
</script>
{% endblock %}
