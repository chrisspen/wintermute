{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Add Response Rule</h3>
      <form method="post" action="/agent-responses">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <div class="field-group">
          <label>Agent</label>
          <select name="agent_id" required>
            {% for agent in agents %}
            <option value="{{ agent.id }}" {% if agent.id == agent_id %}selected{% endif %}>{{ agent.name }}{% if vm_names and vm_names.get(agent.vm_target_id) %} ({{ vm_names[agent.vm_target_id] }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group">
          <label>Pattern</label>
          <textarea name="pattern" rows="5" placeholder="e.g. Update available!\nRelease notes:" required></textarea>
          <p class="muted">One regex per line. All lines must match (case-insensitive, multiline).</p>
        </div>
        <div class="field-group">
          <label>Response</label>
          <textarea name="response" rows="3" placeholder="e.g. 2" required></textarea>
        </div>
        <button type="submit">Create Response Rule</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
