{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Edit Project</h3>
      <form method="post" action="/projects/{{ project.id }}">
        <div class="field-group">
          <label>Name</label>
          <input type="text" name="name" value="{{ project.name }}" required />
        </div>
        <div class="field-group">
          <label>Slug</label>
          <input type="text" name="slug" value="{{ project.slug }}" required />
        </div>
        <div class="field-group">
          <label>Slack Channel ID</label>
          <input type="text" name="slack_channel_id" value="{{ project.slack_channel_id or '' }}" />
        </div>
        <div class="field-group">
          <label>Max Repo Resources</label>
          <input type="number" name="max_repo_resources" min="1" value="{{ project.max_repo_resources }}" />
        </div>
        <div class="field-group">
          <label>Prompt Template</label>
          <textarea name="prompt_template" rows="10">{{ project.prompt_template if project.prompt_template and project.prompt_template | trim else default_prompt_template }}</textarea>
          <p class="muted">Use placeholders like {project_name}, {repo_path}, {branch_name}, {issue_number}, {title}, {description}, {comments}, {internal_notes}.</p>
        </div>
        <button type="submit">Save Project</button>
      </form>
      <div class="divider"></div>
      <form method="post" action="/projects/{{ project.id }}/delete">
        <input type="hidden" name="confirm" value="" />
        <div class="checkbox-row field-group">
          <input type="checkbox" name="delete_slack" id="deleteSlack" />
          <label for="deleteSlack">Also delete Slack channel</label>
        </div>
        <button
          type="button"
          class="danger"
          data-confirm
          data-confirm-message="Are you sure? This cannot be undone."
          data-confirm-phrase="delete me"
        >
          Delete Project
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
