{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Agents</h3>
      <a href="/ui/agents/create?return_to=/ui/agents">Add Agent</a>
    </div>
    <div class="tile">
      <h3>Agent List</h3>
      <ul>
        {% for agent in agents %}
        <li>
          <a href="/ui/agents/{{ agent.id }}/edit">{{ agent.name }}</a> ({{ agent.slug }})
        </li>
        {% else %}
        <li class="muted">No agents yet</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
