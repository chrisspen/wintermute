{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Edit GitLab Token</h3>
      <form method="post" action="/gitlab-tokens/{{ token.id }}/edit">
        <label>Note</label>
        <input type="text" name="note" value="{{ token.note or '' }}" />
        <label>Personal Access Token</label>
        <input type="password" name="token" placeholder="leave blank to keep existing" />
        <button type="submit">Save GitLab Token</button>
      </form>
      <form method="post" action="/gitlab-tokens/{{ token.id }}/delete">
        <button type="button" class="danger" data-confirm data-confirm-message="Delete this GitLab token? This cannot be undone.">Delete GitLab Token</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
