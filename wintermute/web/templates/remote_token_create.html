{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Add Remote Token</h3>
      <form method="post" action="/remote-tokens">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <label>Provider</label>
        <select name="provider" required>
          <option value="github" selected>GitHub</option>
          <option value="gitlab">GitLab</option>
        </select>
        <label>Note</label>
        <input type="text" name="note" placeholder="e.g. gears repo token" />
        <label>Base URL (for self-hosted instances)</label>
        <input type="text" name="base_url" placeholder="e.g. https://gitlab.example.com" />
        <label>Personal Access Token</label>
        <input type="password" name="token" required />
        <button type="submit">Add Token</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
