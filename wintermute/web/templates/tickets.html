{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Tickets</h3>
      <p class="muted">All current tickets.</p>
      <a href="/ui/tickets/create?return_to=/ui/tickets">Create Ticket</a>
    </div>
    <div class="tile">
      <h3>Ticket List</h3>
      <ul>
        {% for ticket in tickets %}
        <li>
          <a href="/ui/tickets/{{ ticket.id }}/edit">{{ ticket.title }}</a> [{{ ticket.status }}]
          {% if ticket.source_url %}
          <a href="{{ ticket.source_url }}" target="_blank">source</a>
          {% endif %}
        </li>
        {% else %}
        <li class="muted">No tickets yet</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
