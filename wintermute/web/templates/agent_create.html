{% extends "base.html" %}

{% block content %}
<style>
.field-error {
  border-color: #ef4444 !important;
  box-shadow: 0 0 0 2px #ef444433;
}
</style>
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Add Agent</h3>
      {% if error_message %}
      <div class="form-error-banner" style="background: #ef444422; border: 1px solid #ef4444; border-radius: 4px; padding: 12px; margin-bottom: 16px; color: #ef4444;">
        <strong>Error:</strong> {{ error_message }}
      </div>
      {% endif %}
      <form method="post" action="/agents">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <label>Name</label>
        <input type="text" name="name" required {% if error_field == 'name' %}class="field-error"{% endif %} />
        <label>Slug</label>
        <input type="text" name="slug" required {% if error_field == 'slug' %}class="field-error"{% endif %} />
        <label>Command</label>
        <input type="text" name="command" required />
        <label>Session Mode</label>
        <select name="session_mode">
          <option value="tmux" selected>tmux</option>
          <option value="mcp">mcp (Codex)</option>
          <option value="claude">claude</option>
          <option value="gemini">gemini</option>
        </select>
        <label>VM Target</label>
        <select name="vm_target_id">
          <option value="">(none)</option>
          {% for vm in vm_targets %}
          <option value="{{ vm.id }}">{{ vm.name }}</option>
          {% endfor %}
        </select>
        <label>Required SSH Options</label>
        <input type="text" name="required_ssh_options" placeholder="e.g. -L 1455:localhost:1455" />
        <label>Environment Variables</label>
        <input type="text" name="env_vars" placeholder="e.g. TERM=dumb NO_COLOR=1" />
        <label>MCP Config Overrides</label>
        <textarea name="mcp_config" rows="3" placeholder="e.g. -c 'sandbox_permissions=[...]'"></textarea>
        <label>Trust Level</label>
        <select name="trust_level">
          <option value="">(none)</option>
          <option value="trusted">trusted</option>
          <option value="untrusted">untrusted</option>
        </select>
        <label>Input Echo Prefix</label>
        <input type="text" name="input_echo_prefix" placeholder="e.g. ›" />
        <label>Response Prefix</label>
        <input type="text" name="response_prefix" placeholder="e.g. •" />
        <h4>LLM API Configuration (for decision path)</h4>
        <label>LLM Base URL</label>
        <input type="text" name="llm_base_url" placeholder="e.g. http://localhost:11434/v1" />
        <label>LLM API Key</label>
        <input type="text" name="llm_api_key" placeholder="e.g. ollama" />
        <label>LLM Model</label>
        <input type="text" name="llm_model" placeholder="e.g. llama3.2" />
        <button type="submit">Add Agent</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
