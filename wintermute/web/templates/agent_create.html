{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Add Agent</h3>
      <form method="post" action="/agents">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <label>Name</label>
        <input type="text" name="name" required />
        <label>Slug</label>
        <input type="text" name="slug" required />
        <label>Command</label>
        <input type="text" name="command" required />
        <label>Session Mode</label>
        <select name="session_mode">
          <option value="tmux" selected>tmux</option>
          <option value="mcp">mcp (Codex)</option>
          <option value="claude">claude</option>
        </select>
        <label>Required SSH Options</label>
        <input type="text" name="required_ssh_options" placeholder="-L 1455:localhost:1455" />
        <label>Environment Variables</label>
        <input type="text" name="env_vars" placeholder="TERM=dumb NO_COLOR=1" />
        <label>MCP Config Overrides</label>
        <textarea name="mcp_config" rows="3" placeholder="-c 'sandbox_permissions=[&quot;disk-full-read-access&quot;,&quot;disk-full-write-access&quot;,&quot;network-full-access&quot;]'"></textarea>
        <label>Trust Level</label>
        <select name="trust_level">
          <option value="">(none)</option>
          <option value="trusted">trusted</option>
          <option value="untrusted">untrusted</option>
        </select>
        <label>Input Echo Prefix</label>
        <input type="text" name="input_echo_prefix" placeholder="›" />
        <label>Response Prefix</label>
        <input type="text" name="response_prefix" placeholder="•" />
        <button type="submit">Add Agent</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
