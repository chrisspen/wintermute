{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Edit Repo Resource</h3>
      <form method="post" action="/repo-resources/{{ resource.id }}">
        <div class="field-group">
          <label>Project</label>
          <input type="text" value="{{ project_lookup.get(resource.project_id, resource.project_id) }}" readonly />
        </div>
        <div class="field-group">
          <label>Project VM</label>
          <input type="text" value="{{ mapping_lookup.get(resource.project_vm_id, resource.project_vm_id) }}" readonly />
        </div>
        <div class="field-group">
          <label>Repo Mode</label>
          <input type="text" value="{{ resource.repo_mode }}" readonly />
        </div>
        <div class="field-group">
          <label>Path</label>
          <input type="text" value="{{ resource.path }}" readonly />
        </div>
        <div class="field-group">
          <label>Status</label>
          <select name="status">
            <option value="available" {% if resource.status == 'available' %}selected{% endif %}>available</option>
            <option value="in_use" {% if resource.status == 'in_use' %}selected{% endif %}>in_use</option>
          </select>
        </div>
        <div class="field-group">
          <label>Session ID</label>
          <input type="text" name="session_id" value="{{ resource.session_id or '' }}" />
        </div>
        <div class="field-group">
          <label>Agent ID</label>
          <input type="text" name="agent_id" value="{{ resource.agent_id or '' }}" />
        </div>
        <div class="field-group">
          <label>Last Used</label>
          <input type="text" value="{{ resource.last_used_at or '' }}" readonly />
        </div>
        <button type="submit">Save Repo Resource</button>
      </form>
      <div class="divider"></div>
      <form method="post" action="/repo-resources/{{ resource.id }}/delete">
        <button type="button" class="danger" data-confirm data-confirm-message="Delete this repo resource? This cannot be undone.">Delete Repo Resource</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
