{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid full">
    <div class="tile wide">
      <h3>Edit Comment</h3>
      <form method="post" action="/comments/{{ comment.id }}/edit">
        <label>Ticket</label>
        <select name="ticket_id" disabled>
          {% for ticket in tickets %}
          <option value="{{ ticket.id }}" {% if ticket.id == comment.ticket_id %}selected{% endif %}>{{ ticket.title }}</option>
          {% endfor %}
        </select>
        <label>Project</label>
        <input type="text" value="{{ project_lookup.get(comment.project_id, comment.project_id or '') }}" readonly />
        <label>Agent</label>
        <input type="text" value="{{ agent_lookup.get(comment.agent_id, comment.agent_id or '') }}" readonly />
        <label>Source</label>
        <input type="text" value="{{ comment.source_id or '' }}" readonly />
        <label>Issue Number</label>
        <input type="text" value="{{ comment.issue_number or '' }}" readonly />
        <label>Sent</label>
        <input type="text" value="{{ 'yes' if comment.sent else 'no' }}" readonly />
        <label>Sent At</label>
        <input type="text" value="{{ comment.sent_at or '' }}" readonly />
        <label>Body</label>
        <textarea name="body" rows="6">{{ comment.body }}</textarea>
        <label class="checkbox">
          <input type="checkbox" name="public" {% if comment.public %}checked{% endif %} />
          Public (eligible for GitHub/GitLab)
        </label>
        <label class="checkbox">
          <input type="checkbox" name="approved" {% if comment.approved %}checked{% endif %} />
          Approved for sending
        </label>
        <button type="submit">Save Comment</button>
      </form>
      <form method="post" action="/comments/{{ comment.id }}/delete">
        <button type="button" class="danger" data-confirm data-confirm-message="Delete this comment? This cannot be undone.">Delete Comment</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
