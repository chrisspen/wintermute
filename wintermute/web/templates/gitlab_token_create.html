{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Add GitLab Token</h3>
      <form method="post" action="/gitlab-tokens">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <label>Note</label>
        <input type="text" name="note" placeholder="e.g. infra group token" />
        <label>Personal Access Token</label>
        <input type="password" name="token" required />
        <button type="submit">Add GitLab Token</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
