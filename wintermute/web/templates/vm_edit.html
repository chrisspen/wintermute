{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Edit VM</h3>
      <form method="post" action="/vms/{{ vm.id }}/edit">
        <div class="field-group">
          <label>Name</label>
          <input type="text" name="name" value="{{ vm.name }}" required />
        </div>
        <div class="field-group">
          <label>Host</label>
          <input type="text" name="host" value="{{ vm.host }}" required />
        </div>
        <div class="field-group">
          <label>User</label>
          <input type="text" name="user" value="{{ vm.user }}" required />
        </div>
        <div class="field-group">
          <label>Port</label>
          <input type="number" name="port" value="{{ vm.port }}" />
        </div>
        <div class="field-group">
          <label>Required Reserve Memory (GB)</label>
          <input type="number" name="required_reserve_memory_gb" value="{{ vm.required_reserve_memory_gb }}" step="0.1" min="0" />
          <small class="hint">Memory to keep free on the VM. Agent starts are blocked if available memory minus agent's expected usage would fall below this reserve.</small>
        </div>
        <button type="submit">Save VM</button>
      </form>
      <form method="post" action="/vms/{{ vm.id }}/delete">
        <button type="button" class="danger" data-confirm data-confirm-message="Delete this VM target? This cannot be undone.">Delete VM</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
