{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Edit VM</h3>
      <form method="post" action="/vms/{{ vm.id }}/edit">
        <label>Name</label>
        <input type="text" name="name" value="{{ vm.name }}" required />
        <label>Host</label>
        <input type="text" name="host" value="{{ vm.host }}" required />
        <label>User</label>
        <input type="text" name="user" value="{{ vm.user }}" required />
        <label>Port</label>
        <input type="number" name="port" value="{{ vm.port }}" />
        <button type="submit">Save VM</button>
      </form>
      <form method="post" action="/vms/{{ vm.id }}/delete">
        <button type="button" class="danger" data-confirm data-confirm-message="Delete this VM target? This cannot be undone.">Delete VM</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
