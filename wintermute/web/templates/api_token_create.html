{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid full">
    <div class="tile wide">
      <h3>Create API Token</h3>
      <form method="post" action="/api-tokens">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <label>Name</label>
        <input type="text" name="name" required />
        <label>Token (leave blank to auto-generate)</label>
        <input type="text" name="token" />
        <label>Write token to env path (optional)</label>
        <input type="text" name="env_path" placeholder=".codex/.env" />
        <div class="perm-panel">
          <h4>Permissions</h4>
          <table class="perm-table">
            <thead>
              <tr>
                <th>Model</th>
                <th>All<br /><input type="checkbox" class="perm-col-all" data-col="all" /></th>
                {% for action in permission_actions %}
                <th>{{ action|capitalize }}<br /><input type="checkbox" class="perm-col-all" data-col="{{ action }}" {% if action != 'update' %}data-admin-disable="1"{% endif %} /></th>
                {% endfor %}
              </tr>
            </thead>
            <tbody>
              {% for model in permission_models %}
              <tr data-model="{{ model.key }}" {% if model.key in ['admin', 'supervisor_state'] %}class="disabled-row"{% endif %}>
                <td>{{ model.label }}</td>
                <td><input type="checkbox" class="perm-row-all" {% if model.key in ['admin', 'supervisor_state'] %}disabled{% endif %} /></td>
                {% for action in permission_actions %}
                <td>
                  <input type="checkbox" name="perm-{{ model.key }}-{{ action }}" class="perm-action" {% if (model.key == 'admin' and action != 'update') or (model.key == 'supervisor_state' and action != 'read') %}disabled{% endif %} />
                </td>
                {% endfor %}
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
        <button type="submit">Create API Token</button>
      </form>
    </div>
  </div>
</div>
<script>
  function updateRowAll(row) {
    var all = row.querySelector('.perm-row-all');
    var actions = row.querySelectorAll('.perm-action');
    var checked = Array.prototype.slice.call(actions).every(function (input) {
      return input.checked;
    });
    all.checked = checked;
  }
  function updateColumnAll(colName) {
    var header = document.querySelector('.perm-col-all[data-col="' + colName + '"]');
    if (!header) {
      return;
    }
    var inputs;
    if (colName === 'all') {
      inputs = document.querySelectorAll('.perm-action');
    } else {
      inputs = document.querySelectorAll('input[name$="-' + colName + '"]');
    }
    var checked = Array.prototype.slice.call(inputs).every(function (input) {
      return input.checked;
    });
    header.checked = checked;
  }
  document.querySelectorAll('.perm-row-all').forEach(function (checkbox) {
    checkbox.addEventListener('change', function () {
      var row = checkbox.closest('tr');
      row.querySelectorAll('.perm-action').forEach(function (input) {
        input.checked = checkbox.checked;
      });
      updateColumnAll('all');
      {% for action in permission_actions %}
      updateColumnAll('{{ action }}');
      {% endfor %}
    });
  });
  document.querySelectorAll('.perm-action').forEach(function (checkbox) {
    checkbox.addEventListener('change', function () {
      var row = checkbox.closest('tr');
      updateRowAll(row);
      updateColumnAll('all');
      {% for action in permission_actions %}
      updateColumnAll('{{ action }}');
      {% endfor %}
    });
  });
  document.querySelectorAll('.perm-col-all').forEach(function (checkbox) {
    checkbox.addEventListener('change', function () {
      var col = checkbox.getAttribute('data-col');
      if (col === 'all') {
        document.querySelectorAll('.perm-action').forEach(function (input) {
          if (!input.disabled) {
            input.checked = checkbox.checked;
          }
        });
      } else {
        document.querySelectorAll('input[name$="-' + col + '"]').forEach(function (input) {
          if (!input.disabled) {
            input.checked = checkbox.checked;
          }
        });
      }
      document.querySelectorAll('table.perm-table tbody tr').forEach(function (row) {
        updateRowAll(row);
      });
      updateColumnAll('all');
      {% for action in permission_actions %}
      updateColumnAll('{{ action }}');
      {% endfor %}
    });
  });
  document.querySelectorAll('table.perm-table tbody tr').forEach(function (row) {
    updateRowAll(row);
  });
  updateColumnAll('all');
  {% for action in permission_actions %}
  updateColumnAll('{{ action }}');
  {% endfor %}
</script>
{% endblock %}
