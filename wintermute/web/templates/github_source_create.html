{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Add GitHub Source</h3>
      {% if token_notice %}
      <p class="muted">{{ token_notice }}</p>
      {% endif %}
      <form method="post" action="/github-sources">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <div class="checkbox-row">
          <input type="checkbox" name="enabled" checked />
          <label>Enabled</label>
        </div>
        <label>Project</label>
        <select name="project_id" required>
          {% for project in projects %}
          <option value="{{ project.id }}">{{ project.name }}</option>
          {% endfor %}
        </select>
        <label>Token</label>
        <select name="token_id" required>
          {% for token in tokens %}
          <option value="{{ token.id }}">{{ token.note or token.user_login or token.id }}</option>
          {% endfor %}
        </select>
        <label>Repo Owner</label>
        <input type="text" name="owner" required />
        <label>Repo Name</label>
        <input type="text" name="repo" required />
        <label>Issue State</label>
        <select name="state">
          <option value="open">open</option>
          <option value="closed">closed</option>
          <option value="all">all</option>
        </select>
        <label>Labels (comma-separated)</label>
        <input type="text" name="labels" />
        <button type="submit">Add GitHub Source</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
