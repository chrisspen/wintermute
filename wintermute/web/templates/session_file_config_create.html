{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Create Session File Config</h3>
      <form method="post" action="/session-file-configs">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <div class="field-group">
          <label>Name</label>
          <input type="text" name="name" placeholder="e.g. Standard Agent" required />
        </div>
        <div class="field-group">
          <label>Description</label>
          <textarea name="description" rows="3" placeholder="Description of this config..."></textarea>
        </div>
        <button type="submit">Create Config</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
