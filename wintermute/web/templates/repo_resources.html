{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Repo Resources</h3>
      <p class="muted">Auto-managed repo working trees by project/VM.</p>
    </div>
    <div class="tile">
      <h3>Resources</h3>
      <ul>
        {% for resource in repo_resources %}
        <li>
          <a href="/ui/repo-resources/{{ resource.id }}/edit">{{ resource.path }}</a>
          ({{ resource.status }})
        </li>
        {% else %}
        <li class="muted">No repo resources yet</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
