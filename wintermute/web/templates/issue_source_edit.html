{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Edit Issue Source</h3>
      <form method="post" action="/issue-sources/{{ source.id }}/edit">
        <div class="checkbox-row">
          <input type="checkbox" name="enabled" {% if source.enabled %}checked{% endif %} />
          <label>Enabled</label>
        </div>
        <div class="field-group">
          <label>Provider</label>
          <select name="provider" id="provider-select" required>
            <option value="github" {% if source.provider == 'github' %}selected{% endif %}>GitHub</option>
            <option value="gitlab" {% if source.provider == 'gitlab' %}selected{% endif %}>GitLab</option>
          </select>
        </div>
        <div class="field-group">
          <label>Project</label>
          <select name="project_id" required>
            {% for project in projects %}
            <option value="{{ project.id }}" {% if project.id == source.project_id %}selected{% endif %}>{{ project.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group" id="github-token-group" {% if source.provider != 'github' %}style="display: none;"{% endif %}>
          <label>GitHub Token</label>
          <select name="github_token_id">
            <option value="">Select a token</option>
            {% for token in github_tokens %}
            <option value="{{ token.id }}" {% if token.id == source.token_id and source.provider == 'github' %}selected{% endif %}>{{ token.note or token.user_login or token.id }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group" id="gitlab-token-group" {% if source.provider != 'gitlab' %}style="display: none;"{% endif %}>
          <label>GitLab Token</label>
          <select name="gitlab_token_id">
            <option value="">Select a token</option>
            {% for token in gitlab_tokens %}
            <option value="{{ token.id }}" {% if token.id == source.token_id and source.provider == 'gitlab' %}selected{% endif %}>{{ token.note or token.user_login or token.id }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group">
          <label>Agent</label>
          <select name="agent_id">
            <option value="">None</option>
            {% for agent in agents %}
            <option value="{{ agent.id }}" {% if agent.id == source.agent_id %}selected{% endif %}>{{ agent.name }}{% if vm_names and vm_names.get(agent.vm_target_id) %} ({{ vm_names[agent.vm_target_id] }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group">
          <label>Repository Path</label>
          <input type="text" name="repo" value="{{ source.repo }}" required />
        </div>
        <div class="field-group">
          <label>Issue State</label>
          <select name="state">
            <option value="open" {% if source.state == 'open' %}selected{% endif %}>open</option>
            <option value="closed" {% if source.state == 'closed' %}selected{% endif %}>closed</option>
            <option value="all" {% if source.state == 'all' %}selected{% endif %}>all</option>
          </select>
        </div>
        <div class="field-group">
          <label>Labels (comma-separated)</label>
          <input type="text" name="labels" value="{{ labels }}" />
        </div>
        <div class="checkbox-row">
          <input type="checkbox" name="auto_start" {% if source.auto_start %}checked{% endif %} />
          <label>Auto-start agent sessions for issues</label>
        </div>
        <div class="field-group">
          <label>Poll Interval (seconds)</label>
          <input type="number" name="poll_interval_seconds" min="10" value="{{ source.poll_interval_seconds }}" />
        </div>
        <button type="submit">Save Issue Source</button>
      </form>
      <form method="post" action="/issue-sources/{{ source.id }}/delete">
        <button type="button" class="danger" data-confirm data-confirm-message="Delete this issue source? This cannot be undone.">Delete Issue Source</button>
      </form>
    </div>
  </div>
</div>
<script>
(function() {
  var providerSelect = document.getElementById('provider-select');
  var githubTokenGroup = document.getElementById('github-token-group');
  var gitlabTokenGroup = document.getElementById('gitlab-token-group');

  function updateTokenVisibility() {
    var provider = providerSelect.value;
    if (provider === 'github') {
      githubTokenGroup.style.display = 'block';
      gitlabTokenGroup.style.display = 'none';
    } else {
      githubTokenGroup.style.display = 'none';
      gitlabTokenGroup.style.display = 'block';
    }
  }

  providerSelect.addEventListener('change', updateTokenVisibility);
})();
</script>
{% endblock %}
