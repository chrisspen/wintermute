{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>GitLab Tokens</h3>
      <a href="/ui/gitlab-tokens/create?return_to=/ui/gitlab-tokens">Add GitLab Token</a>
    </div>
    <div class="tile">
      <h3>Token List</h3>
      <ul>
        {% for token in tokens %}
        <li>
          <a href="/ui/gitlab-tokens/{{ token.id }}/edit">{{ token.note or token.user_login or token.id }}</a>
        </li>
        {% else %}
        <li class="muted">No GitLab tokens yet</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
