{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Work Items</h3>
      <p class="muted">All work items across sources.</p>
    </div>
    <div class="tile">
      <h3>List</h3>
      <ul>
        {% for item in work_items %}
        <li>
          <a href="/ui/work-items/{{ item.work_id|urlencode }}">{{ item.work_id }}</a>
          [{{ item.status }}]
        </li>
        {% else %}
        <li class="muted">No work items yet</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
