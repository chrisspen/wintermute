{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Add GitLab Source</h3>
      {% if token_notice %}
      <p class="muted">{{ token_notice }}</p>
      {% endif %}
      <form method="post" action="/gitlab-sources">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <div class="checkbox-row">
          <input type="checkbox" name="enabled" checked />
          <label>Enabled</label>
        </div>
        <label>Project</label>
        <select name="project_id" required>
          {% for project in projects %}
          <option value="{{ project.id }}">{{ project.name }}</option>
          {% endfor %}
        </select>
        <label>Token</label>
        <select name="token_id" required>
          {% for token in tokens %}
          <option value="{{ token.id }}">{{ token.note or token.user_login or token.id }}</option>
          {% endfor %}
        </select>
        <label>Agent</label>
        <select name="agent_id">
          <option value="">None</option>
          {% for agent in agents %}
          <option value="{{ agent.id }}">{{ agent.name }}</option>
          {% endfor %}
        </select>
        <label>Project Path</label>
        <input type="text" name="project_path" placeholder="group/subgroup/repo" required />
        <label>Issue State</label>
        <select name="state">
          <option value="open" selected>open</option>
          <option value="closed">closed</option>
          <option value="all">all</option>
        </select>
        <label>Labels (comma-separated)</label>
        <input type="text" name="labels" />
        <div class="checkbox-row">
          <input type="checkbox" name="auto_start" />
          <label>Auto-start agent sessions for issues</label>
        </div>
        <button type="submit">Add GitLab Source</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
