{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid section-gap">
    <div class="tile">
      <h3>Edit Sprint</h3>
      <form method="post" action="/sprints/{{ sprint.id }}/edit">
        <div class="field-group">
          <label>Name</label>
          <input type="text" name="name" value="{{ sprint.name }}" required />
        </div>
        <div class="field-group">
          <label>Start Date</label>
          <input type="date" name="start_date" value="{{ sprint.start_date[:10] if sprint.start_date else '' }}" required />
        </div>
        <div class="field-group">
          <label>End Date</label>
          <input type="date" name="end_date" value="{{ sprint.end_date[:10] if sprint.end_date else '' }}" required />
        </div>
        <div class="field-group">
          <label>Status</label>
          <select name="status">
            <option value="active" {% if sprint.status == "active" %}selected{% endif %}>Active</option>
            <option value="closed" {% if sprint.status == "closed" %}selected{% endif %}>Closed</option>
          </select>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" name="enabled" {% if sprint.enabled %}checked{% endif %} />
          <label>Auto-cycle (automatically create next sprint when this one ends)</label>
        </div>
        <button type="submit">Save Sprint</button>
      </form>
      <div class="form-actions">
        <form method="post" action="/sprints/{{ sprint.id }}/delete">
          <button type="button" class="danger" data-confirm data-confirm-message="Delete this sprint? Tickets will be unassigned from this sprint.">Delete Sprint</button>
        </form>
      </div>
    </div>
  </div>
  <div class="grid section-gap">
    <div class="tile wide">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
        <h3 style="margin: 0; white-space: nowrap;">Tickets in this Sprint</h3>
        <button type="button" class="ghost" id="add-ticket-btn" style="padding: 2px 8px; font-size: 12px; white-space: nowrap;">+ Add</button>
      </div>
      {% set sprint_id = sprint.id %}
      {% set show_remove_button = true %}
      {% include "_sprint_tickets_table.html" %}
    </div>
  </div>
</div>

<!-- Add Ticket Modal -->
<div class="modal" id="add-ticket-modal">
  <div class="modal-card wide">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="margin: 0;">Add Tickets to Sprint</h3>
      <button type="button" class="modal-close" id="modal-close-btn"><i class="fa-solid fa-times"></i></button>
    </div>
    <div class="field-group" style="margin-bottom: 16px;">
      <input type="text" id="ticket-search" placeholder="Search tickets..." style="width: 100%;" />
    </div>
    <div id="available-tickets-list" style="max-height: 400px; overflow-y: auto;">
      <p class="muted">Loading...</p>
    </div>
    <div id="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
      <span id="pagination-info" class="muted"></span>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="ghost" id="prev-page-btn" disabled>Prev</button>
        <button type="button" class="ghost" id="next-page-btn" disabled>Next</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var sprintId = '{{ sprint.id }}';
  var modal = document.getElementById('add-ticket-modal');
  var addBtn = document.getElementById('add-ticket-btn');
  var closeBtn = document.getElementById('modal-close-btn');
  var searchInput = document.getElementById('ticket-search');
  var ticketsList = document.getElementById('available-tickets-list');
  var paginationInfo = document.getElementById('pagination-info');
  var prevBtn = document.getElementById('prev-page-btn');
  var nextBtn = document.getElementById('next-page-btn');
  var sprintTicketsList = document.getElementById('sprint-tickets-list');
  var noTicketsMsg = document.getElementById('no-tickets-msg');

  var currentPage = 1;
  var totalPages = 1;
  var searchTimeout = null;

  function openModal() {
    modal.classList.add('open');
    currentPage = 1;
    searchInput.value = '';
    loadAvailableTickets();
    searchInput.focus();
  }

  function closeModal() {
    modal.classList.remove('open');
  }

  function loadAvailableTickets() {
    var q = searchInput.value.trim();
    var url = '/api/sprints/' + sprintId + '/available-tickets?page=' + currentPage + '&per_page=15';
    if (q) {
      url += '&q=' + encodeURIComponent(q);
    }
    fetch(url, { credentials: 'same-origin' })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        totalPages = data.pages;
        renderAvailableTickets(data.tickets);
        updatePagination(data);
      })
      .catch(function(err) {
        ticketsList.innerHTML = '<p class="muted">Error loading tickets</p>';
      });
  }

  function renderAvailableTickets(tickets) {
    if (tickets.length === 0) {
      ticketsList.innerHTML = '<p class="muted">No available tickets found</p>';
      return;
    }
    var html = '<table class="data-table" style="width: 100%;"><thead><tr><th>Title</th><th>Status</th><th>Priority</th><th>Points</th><th></th></tr></thead><tbody>';
    tickets.forEach(function(t) {
      html += '<tr data-ticket-id="' + t.id + '">';
      html += '<td>' + escapeHtml(t.title) + '</td>';
      html += '<td><span class="muted">' + t.status + '</span></td>';
      html += '<td><span class="muted">' + (t.priority || '-') + '</span></td>';
      html += '<td><span class="muted">' + (t.story_points || '-') + '</span></td>';
      html += '<td style="text-align: right;"><button type="button" class="ghost add-to-sprint-btn" data-ticket-id="' + t.id + '" data-ticket-title="' + escapeHtml(t.title) + '" data-ticket-status="' + t.status + '" data-ticket-priority="' + (t.priority || '') + '" data-ticket-points="' + (t.story_points || '') + '" style="padding: 4px 8px; font-size: 12px;">Add</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    ticketsList.innerHTML = html;
  }

  function updatePagination(data) {
    paginationInfo.textContent = 'Page ' + data.page + ' of ' + data.pages + ' (' + data.total + ' tickets)';
    prevBtn.disabled = data.page <= 1;
    nextBtn.disabled = data.page >= data.pages;
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function addTicketToSprint(ticketId, ticketTitle, ticketStatus, ticketPriority, ticketPoints) {
    fetch('/api/sprints/' + sprintId + '/tickets/' + ticketId, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.ok) {
        // Remove from available list
        var row = ticketsList.querySelector('tr[data-ticket-id="' + ticketId + '"]');
        if (row) row.remove();
        // Add to sprint tickets list
        addTicketToSprintList(ticketId, ticketTitle, ticketStatus, ticketPriority, ticketPoints);
      }
    });
  }

  function addTicketToSprintList(ticketId, title, status, priority, points) {
    // Hide "no tickets" message if present
    if (noTicketsMsg) {
      noTicketsMsg.style.display = 'none';
    }
    // Find or create table
    var table = sprintTicketsList.querySelector('table');
    if (!table) {
      var html = '<table class="data-table" style="width: 100%;"><thead><tr><th style="text-align: left;">Title</th><th style="text-align: left;">Status</th><th style="text-align: left;">Priority</th><th style="text-align: left;">Points</th><th></th></tr></thead><tbody></tbody></table>';
      sprintTicketsList.innerHTML = html;
      table = sprintTicketsList.querySelector('table');
    }
    var tbody = table.querySelector('tbody');
    var tr = document.createElement('tr');
    tr.setAttribute('data-ticket-id', ticketId);
    tr.innerHTML = '<td><a href="/ui/tickets/' + ticketId + '/edit">' + escapeHtml(title) + '</a></td>' +
      '<td class="editable-cell" data-field="status" data-value="' + status + '"><span class="cell-display muted">' + status + '</span></td>' +
      '<td class="editable-cell" data-field="priority" data-value="' + (priority || '') + '"><span class="cell-display muted">' + (priority || '-') + '</span></td>' +
      '<td class="editable-cell" data-field="story_points" data-value="' + (points || '') + '"><span class="cell-display muted">' + (points || '-') + '</span></td>' +
      '<td style="text-align: right;"><button type="button" class="ghost danger-text remove-ticket-btn" data-ticket-id="' + ticketId + '" style="padding: 4px 8px; font-size: 12px;">Remove</button></td>';
    tbody.appendChild(tr);
  }

  function removeTicketFromSprint(ticketId) {
    fetch('/api/sprints/' + sprintId + '/tickets/' + ticketId, {
      method: 'DELETE',
      credentials: 'same-origin'
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.ok) {
        var row = sprintTicketsList.querySelector('tr[data-ticket-id="' + ticketId + '"]');
        if (row) row.remove();
        // Check if table is empty
        var tbody = sprintTicketsList.querySelector('tbody');
        if (tbody && tbody.children.length === 0) {
          sprintTicketsList.innerHTML = '<p class="muted" id="no-tickets-msg">No tickets in this sprint</p>';
        }
        // Reload modal if open
        if (modal.classList.contains('open')) {
          loadAvailableTickets();
        }
      }
    });
  }

  // Event listeners
  addBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);

  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) {
      closeModal();
    }
  });

  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() {
      currentPage = 1;
      loadAvailableTickets();
    }, 300);
  });

  prevBtn.addEventListener('click', function() {
    if (currentPage > 1) {
      currentPage--;
      loadAvailableTickets();
    }
  });

  nextBtn.addEventListener('click', function() {
    if (currentPage < totalPages) {
      currentPage++;
      loadAvailableTickets();
    }
  });

  // Delegate click for add buttons in modal
  ticketsList.addEventListener('click', function(e) {
    var btn = e.target.closest('.add-to-sprint-btn');
    if (btn) {
      var ticketId = btn.getAttribute('data-ticket-id');
      var ticketTitle = btn.getAttribute('data-ticket-title');
      var ticketStatus = btn.getAttribute('data-ticket-status');
      var ticketPriority = btn.getAttribute('data-ticket-priority');
      var ticketPoints = btn.getAttribute('data-ticket-points');
      addTicketToSprint(ticketId, ticketTitle, ticketStatus, ticketPriority, ticketPoints);
    }
  });

})();
</script>
{% endblock %}
