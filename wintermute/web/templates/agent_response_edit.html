{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid section-gap">
    <div class="tile">
      <h3>Edit Response Rule</h3>
      <form method="post" action="/agent-responses/{{ response.id }}/edit">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <div class="field-group">
          <label>Agent</label>
          <select name="agent_id" required>
            {% for agent in agents %}
            <option value="{{ agent.id }}" {% if agent.id == response.agent_id %}selected{% endif %}>{{ agent.name }}{% if vm_names and vm_names.get(agent.vm_target_id) %} ({{ vm_names[agent.vm_target_id] }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group">
          <label>Pattern</label>
          <textarea name="pattern" rows="5" required>{{ response.pattern }}</textarea>
          <p class="muted">One regex per line. All lines must match (case-insensitive, multiline).</p>
        </div>
        <div class="field-group">
          <label>Response</label>
          <textarea name="response" rows="3" required>{{ response.response }}</textarea>
        </div>
        <button type="submit">Save Response Rule</button>
      </form>
      <div class="form-actions">
        <form method="post" action="/agent-responses/{{ response.id }}/delete">
          <button type="button" class="danger" data-confirm data-confirm-message="Delete this response rule? This cannot be undone.">Delete Response Rule</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
