{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Edit GitHub Token</h3>
      <p class="muted">User: {{ token.user_login or 'unknown' }}{% if token.user_id %} ({{ token.user_id }}){% endif %}</p>
      <form method="post" action="/github-tokens/{{ token.id }}/edit">
        <div class="field-group">
          <label>Note</label>
          <input type="text" name="note" value="{{ token.note or '' }}" />
        </div>
        <div class="field-group">
          <label>Personal Access Token</label>
          <input type="password" name="token" placeholder="leave blank to keep existing" />
        </div>
        <button type="submit">Save GitHub Token</button>
      </form>
      <form method="post" action="/github-tokens/{{ token.id }}/delete">
        <button type="button" class="danger" data-confirm data-confirm-message="Delete this GitHub token? This cannot be undone.">Delete GitHub Token</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
