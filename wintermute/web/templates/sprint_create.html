{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Add Sprint</h3>
      <form method="post" action="/sprints">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <div class="field-group">
          <label>Name</label>
          <input type="text" name="name" placeholder="e.g. Sprint 1" required />
        </div>
        <div class="field-group">
          <label>Start Date</label>
          <input type="date" name="start_date" value="{{ default_start }}" required />
        </div>
        <div class="field-group">
          <label>End Date</label>
          <input type="date" name="end_date" value="{{ default_end }}" required />
        </div>
        <div class="checkbox-row">
          <input type="checkbox" name="enabled" checked />
          <label>Auto-cycle (automatically create next sprint when this one ends)</label>
        </div>
        <button type="submit">Add Sprint</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
