{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="grid">
    <div class="tile">
      <h3>Create Ticket</h3>
      <form method="post" action="/tickets">
        <input type="hidden" name="return_to" value="{{ return_to }}" />
        <div class="field-group">
          <label>Project</label>
          <select name="project_id" required>
            {% for project in projects %}
            <option value="{{ project.id }}" {% if project.id == selected_project_id %}selected{% endif %}>{{ project.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group">
          <label>Agent</label>
          <select name="agent_id">
            <option value="">(none)</option>
            {% for agent in agents %}
            <option value="{{ agent.id }}">{{ agent.name }}{% if vm_names and vm_names.get(agent.vm_target_id) %} ({{ vm_names[agent.vm_target_id] }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group">
          <label>Title</label>
          <input type="text" name="title" required />
        </div>
        <div class="field-group">
          <label>Description</label>
          <textarea name="description" rows="4"></textarea>
        </div>
        <div class="field-group">
          <label>Source URL</label>
          <input type="text" name="source_url" placeholder="e.g. https://github.com/org/repo/issues/123" />
        </div>
        <div class="field-group">
          <label>Internal Notes</label>
          <textarea name="internal_notes" rows="4"></textarea>
        </div>
        <div class="field-group">
          <label>Assigned To</label>
          <select name="assigned_to">
            <option value="">(unassigned)</option>
            {% if users %}
            <optgroup label="Users">
              {% for user in users %}
              <option value="user:{{ user.id }}">{{ user.username }}</option>
              {% endfor %}
            </optgroup>
            {% endif %}
            {% if agents %}
            <optgroup label="Agents">
              {% for agent in agents %}
              <option value="agent:{{ agent.id }}">{{ agent.name }}{% if vm_names and vm_names.get(agent.vm_target_id) %} ({{ vm_names[agent.vm_target_id] }}){% endif %}</option>
              {% endfor %}
            </optgroup>
            {% endif %}
          </select>
        </div>
        <div class="field-group">
          <label>Sprint</label>
          <select name="sprint_id">
            <option value="">(none)</option>
            {% for sprint in sprints %}
            <option value="{{ sprint.id }}" {% if sprint.status == 'active' %}selected{% endif %}>{{ sprint.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-group">
          <label>Priority</label>
          <select name="priority">
            <option value="">(none)</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field-group">
          <label>Story Points</label>
          <input type="number" name="story_points" step="0.5" min="0" placeholder="e.g. 3" />
        </div>
        <div class="field-group">
          <label>Hours</label>
          <input type="number" name="hours" step="0.25" min="0" placeholder="e.g. 4" />
        </div>
        <div class="field-group">
          <label>Estimate (legacy)</label>
          <input type="text" name="estimate" placeholder="e.g. 2h or 3pts" />
        </div>
        <div class="field-group">
          <label>Status</label>
          <select name="status">
            <option value="open">open</option>
            <option value="in-progress">in-progress</option>
            <option value="needs-feedback">needs-feedback</option>
            <option value="done">done</option>
          </select>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" name="auto_start" />
          <label>Auto-start agent session when open</label>
        </div>
        <button type="submit">Create Ticket</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
